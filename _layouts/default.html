<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="page-header" role="banner">
      <h1 class="project-name"><a href="{{ '/' | relative_url }}">{{ site.name }}</a></h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      <nav class="site-nav" aria-label="Main">
        {%- assign here = page.url | replace: '.html', '' -%}
        <a href="{{ '/' | relative_url }}" class="btn{% if here == '/' or here == '/index' %} active{% endif %}">Home</a>
        <a href="{{ '/projects' | relative_url }}" class="btn{% if here == '/projects' %} active{% endif %}">Projects</a>
        <a href="{{ '/resume' | relative_url }}" class="btn{% if here == '/resume' %} active{% endif %}">Resume</a>
        <a href="{{ site.social_links.github }}" class="btn" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-credits">
          <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
          <a href="{{ site.social_links.github }}" target="_blank" rel="noopener">GitHub</a> ·
          <a href="{{ site.social_links.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        </span>
      </footer>
    </main>
  </body>
</html>
